name = "mileshighclub"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "MHC_DB"
database_name = "mileshighclub"
database_id = "TO_BE_FILLED_BY_WRANGLER_CREATE"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "mileshighclub-receipts"

[vars]
ADMIN_TELEGRAM_ID = "1231127407"
ADMIN_USERNAMES = "mileschan852,hkmembersonly"
# TELEGRAM_BOT_TOKEN goes in `wrangler secret put ...`

[assets]
directory = "./dist"
binding = "ASSETS"
